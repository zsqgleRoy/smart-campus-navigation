<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="512" height="512" fill="#1989fa" rx="100"/>
  
  <!-- 渐变背景 -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1989fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#07c160;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" fill="url(#grad)" rx="100"/>
  
  <!-- 主图标 - 校园建筑 -->
  <g transform="translate(256, 256)">
    <!-- 建筑主体 -->
    <rect x="-120" y="-80" width="240" height="160" fill="#ffffff" rx="10" opacity="0.9"/>
    
    <!-- 建筑顶部 -->
    <polygon points="-120,-80 0,-120 120,-80" fill="#ffffff" opacity="0.9"/>
    
    <!-- 窗户 -->
    <rect x="-100" y="-40" width="40" height="50" fill="#1989fa" rx="5"/>
    <rect x="-40" y="-40" width="40" height="50" fill="#1989fa" rx="5"/>
    <rect x="20" y="-40" width="40" height="50" fill="#1989fa" rx="5"/>
    <rect x="80" y="-40" width="40" height="50" fill="#1989fa" rx="5"/>
    
    <!-- 门 -->
    <rect x="-30" y="20" width="60" height="80" fill="#1989fa" rx="5"/>
    
    <!-- 文字 "校园导航" -->
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">校园导航</text>
  </g>
</svg>

